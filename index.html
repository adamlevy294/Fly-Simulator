<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#b9e8ef">
  <title>טייסת קטנה | מסע בין טבעות</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173744;
      --sky: #b9e8ef;
      --coral: #f57f68;
      --gold: #f3b93f;
      --paper: #fffdf4;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      color: var(--ink);
      background: var(--sky);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .topbar {
      position: absolute;
      z-index: 2;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      direction: rtl;
      pointer-events: none;
    }

    .brand { display: grid; gap: 3px; text-shadow: 0 2px 0 rgba(255,255,255,.46); }
    .brand strong { font-size: clamp(20px, 3vw, 27px); line-height: 1; letter-spacing: 0; }
    .brand span { font-size: 12px; font-weight: 700; color: #44717a; }

    .scoreboard { display: flex; gap: 9px; direction: rtl; }
    .score-box {
      min-width: 84px;
      padding: 9px 13px 8px;
      border: 1px solid rgba(35, 89, 99, .12);
      border-radius: 8px;
      background: rgba(255, 253, 244, .86);
      box-shadow: 0 4px 0 rgba(30, 90, 100, .08);
      text-align: center;
    }
    .score-box span { display: block; margin-bottom: 2px; color: #60838a; font-size: 10px; font-weight: 800; }
    .score-box strong { font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-box.best strong { color: #d99623; }

    .overlay {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 90px 20px 110px;
      background: rgba(24, 71, 80, .12);
      transition: opacity .2s ease, visibility .2s ease;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .panel {
      width: min(420px, 100%);
      padding: 27px 30px 25px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 8px 0 rgba(37, 93, 98, .12), 0 24px 60px rgba(28, 81, 91, .18);
      text-align: center;
      animation: pop-in .48s cubic-bezier(.2,.8,.25,1.15) both;
    }
    .plane-stamp { font-size: 43px; line-height: 1.2; filter: drop-shadow(0 3px 0 rgba(220, 151, 33, .24)); }
    h1 { margin: 4px 0 7px; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; letter-spacing: 0; }
    .panel p { margin: 0 auto 20px; max-width: 290px; color: #53747a; font-size: 15px; line-height: 1.55; }
    .start-button {
      min-height: 50px;
      width: 100%;
      border: 0;
      border-radius: 7px;
      background: var(--coral);
      color: white;
      font: inherit;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 4px 0 #d96450;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .start-button:hover { background: #f16f59; transform: translateY(-1px); box-shadow: 0 5px 0 #d96450; }
    .start-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d96450; }
    .instructions { margin-top: 15px; color: #719096; font-size: 12px; font-weight: 700; }
    kbd {
      display: inline-grid;
      min-width: 25px;
      height: 24px;
      place-items: center;
      margin: 0 2px;
      border: 1px solid #c8dadd;
      border-bottom-width: 3px;
      border-radius: 5px;
      background: #f7fbf8;
      color: #315a62;
      font: inherit;
      font-size: 12px;
    }

    .bottom-hint {
      position: absolute;
      z-index: 2;
      right: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(50%);
      padding: 9px 15px;
      border: 1px solid rgba(48, 104, 111, .12);
      border-radius: 7px;
      background: rgba(255,253,244,.72);
      color: #4f777e;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }

    .photo-credit {
      position: absolute;
      z-index: 2;
      left: 14px;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 66px));
      color: rgba(255, 255, 255, .9);
      font-size: 10px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(10, 31, 43, .8);
    }
    .photo-credit a { color: inherit; text-decoration-color: rgba(255, 255, 255, .55); }

    .touch-controls {
      position: absolute;
      z-index: 4;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      direction: ltr;
    }
    .touch-controls button {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(36, 87, 96, .18);
      border-radius: 8px;
      background: rgba(255, 253, 244, .78);
      color: #315b63;
      font: inherit;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 3px 0 rgba(41, 91, 97, .15);
      touch-action: none;
    }
    .touch-controls button:active, .touch-controls button.pressed { transform: translateY(2px); box-shadow: 0 1px 0 rgba(41, 91, 97, .15); background: #fffdf4; }

    @keyframes pop-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 560px) {
      .topbar { top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; }
      .score-box { min-width: 64px; padding: 8px 9px 7px; }
      .score-box strong { font-size: 18px; }
      .scoreboard { gap: 6px; }
      .brand span { font-size: 10px; }
      .bottom-hint { bottom: max(22px, env(safe-area-inset-bottom)); font-size: 11px; }
      .touch-controls { left: 14px; bottom: max(13px, env(safe-area-inset-bottom)); }
      .touch-controls button { width: 46px; height: 46px; }
      .panel { padding: 24px 21px 22px; }
    }
    @media (hover: none) {
      .bottom-hint { bottom: max(75px, calc(env(safe-area-inset-bottom) + 65px)); }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="סימולטור טיסה">
    <canvas id="scene" aria-label="מטוס עובר דרך טבעות זהב בשמיים"></canvas>
    <header class="topbar">
      <div class="brand"><strong>טייסת קטנה</strong><span>מסע בין טבעות</span></div>
      <div class="scoreboard" aria-live="polite">
        <div class="score-box"><span>טבעות</span><strong id="score">0</strong></div>
        <div class="score-box best"><span>שיא</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section id="overlay" class="overlay" aria-label="מסך פתיחה">
      <div class="panel">
        <div class="plane-stamp" aria-hidden="true">✈️</div>
        <h1 id="title">מוכנים להמראה?</h1>
        <p id="message">טוסו בין העננים, כוונו את המטוס ועברו דרך טבעות הזהב.</p>
        <button id="start" class="start-button" type="button">מתחילים לטוס</button>
        <div class="instructions"><kbd>↑</kbd> לעלות <kbd>↓</kbd> לרדת</div>
      </div>
    </section>

    <div class="bottom-hint">עברו בדיוק באמצע הטבעת כדי לצבור נקודה</div>
    <div class="photo-credit"><a href="https://www.pexels.com/photo/lake-and-mountain-417074/" target="_blank" rel="noopener noreferrer">נוף: James Wheeler / Pexels</a></div>
    <div class="touch-controls" aria-label="כפתורי טיסה למגע">
      <button type="button" data-direction="down" aria-label="להוריד את המטוס">↓</button>
      <button type="button" data-direction="up" aria-label="להעלות את המטוס">↑</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('scene');
      const context = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const startButton = document.getElementById('start');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const scoreLabel = document.getElementById('score');
      const bestLabel = document.getElementById('best');
      const controls = [...document.querySelectorAll('.touch-controls button')];
      const keys = { up: false, down: false };
      const bestKey = 'little-pilot-best';
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let lastTime = 0;
      let elapsed = 0;
      let score = 0;
      let best = Number(localStorage.getItem(bestKey) || 0);
      let status = 'ready';
      let planeY = 0;
      let planeVelocity = 0;
      let smokeTimer = 0;
      let audioContext = null;
      let rings = [];
      let clouds = [];
      let particles = [];
      let smoke = [];
      let floatingScores = [];
      const landscapeImage = new Image();
      let landscapeReady = false;
      landscapeImage.onload = () => { landscapeReady = true; };
      landscapeImage.src = 'data:image/jpeg;base64,PHOTO_DATA_PLACEHOLDER';

      const aircraftFaces = (() => {
        const faces = [];
        const addTriangle = (a, b, c, color) => faces.push({ points: [a, b, c], color });
        const addQuad = (a, b, c, d, color) => {
          addTriangle(a, b, c, color);
          addTriangle(a, c, d, color);
        };
        const sections = [
          [-1.22, .035, .04], [-.92, .105, .11], [-.52, .17, .16],
          [.08, .205, .19], [.67, .16, .15], [1.08, .095, .09], [1.3, .012, .018]
        ];
        for (let section = 0; section < sections.length - 1; section++) {
          for (let side = 0; side < 12; side++) {
            const angle0 = side / 12 * Math.PI * 2;
            const angle1 = (side + 1) / 12 * Math.PI * 2;
            const point = (part, angle) => [part[0], Math.cos(angle) * part[1], Math.sin(angle) * part[2]];
            const upperness = Math.sin((angle0 + angle1) / 2);
            const sideness = Math.cos((angle0 + angle1) / 2);
            const color = upperness > .42 ? '#fff4d4' : sideness < -.25 ? '#f0c35d' : '#d99a4b';
            addQuad(point(sections[section], angle0), point(sections[section + 1], angle0), point(sections[section + 1], angle1), point(sections[section], angle1), color);
          }
        }

        for (const side of [-1, 1]) {
          addQuad([.34, side * .17, .025], [-.12, side * 1.62, .015], [-.76, side * 1.62, -.005], [-.55, side * .17, .07], '#ed7662');
          addQuad([-.55, side * .17, .07], [-.76, side * 1.62, -.005], [-.81, side * 1.62, -.075], [-.57, side * .17, -.065], '#b9584e');
          addQuad([-.78, side * .92, .016], [-.94, side * 1.45, .01], [-1.14, side * 1.45, -.005], [-1.08, side * .92, .025], '#e9836c');
        }
        addQuad([.72, -.105, .17], [.2, -.105, .25], [.2, .105, .25], [.72, .105, .17], '#79c8d2');
        addTriangle([-.95, -.04, .1], [-.48, -.04, .1], [-.82, -.04, .58], '#e96f5d');
        addTriangle([-.95, .04, .1], [-.82, .04, .58], [-.48, .04, .1], '#f38a70');
        addQuad([.15, -.25, -.12], [-.05, -1.62, -.07], [-.78, -1.62, -.12], [-.5, -.25, -.18], '#bd6759');
        addQuad([.15, .25, -.12], [-.5, .25, -.18], [-.78, 1.62, -.12], [-.05, 1.62, -.07], '#bd6759');
        return faces;
      })();

      bestLabel.textContent = best;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        if (!planeY || status !== 'playing') planeY = height * .48;
        seedClouds();
      }

      function seedClouds() {
        clouds = Array.from({ length: Math.ceil(width / 150) + 4 }, (_, index) => ({
          x: index * 175 + Math.random() * 100,
          y: 55 + Math.random() * height * .68,
          size: 22 + Math.random() * 38,
          speed: 8 + Math.random() * 16,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function roundedRect(x, y, w, h, radius) {
        context.beginPath();
        context.roundRect(x, y, w, h, radius);
      }

      function drawCloud(cloud, time) {
        const bob = Math.sin(time * .00045 + cloud.phase) * 4;
        const x = cloud.x;
        const y = cloud.y + bob;
        context.fillStyle = 'rgba(255, 255, 255, .72)';
        context.beginPath();
        context.ellipse(x, y, cloud.size * .9, cloud.size * .25, 0, 0, Math.PI * 2);
        context.ellipse(x - cloud.size * .38, y - cloud.size * .12, cloud.size * .42, cloud.size * .31, 0, 0, Math.PI * 2);
        context.ellipse(x + cloud.size * .05, y - cloud.size * .25, cloud.size * .48, cloud.size * .4, 0, 0, Math.PI * 2);
        context.ellipse(x + cloud.size * .45, y - cloud.size * .1, cloud.size * .38, cloud.size * .28, 0, 0, Math.PI * 2);
        context.fill();
      }

      function drawBackground(time, delta) {
        if (landscapeReady) {
          const scale = Math.max(width / landscapeImage.width, height / landscapeImage.height) * 1.12;
          const imageWidth = landscapeImage.width * scale;
          const imageHeight = landscapeImage.height * scale;
          const pan = Math.sin(time * .000055) * Math.max(0, imageWidth - width) * .45;
          context.drawImage(landscapeImage, (width - imageWidth) / 2 - pan, (height - imageHeight) / 2, imageWidth, imageHeight);
          const atmosphere = context.createLinearGradient(0, 0, 0, height);
          atmosphere.addColorStop(0, 'rgba(24, 68, 91, .1)');
          atmosphere.addColorStop(.58, 'rgba(41, 84, 94, .02)');
          atmosphere.addColorStop(1, 'rgba(18, 44, 55, .24)');
          context.fillStyle = atmosphere;
          context.fillRect(0, 0, width, height);
        } else {
          const sky = context.createLinearGradient(0, 0, 0, height);
          sky.addColorStop(0, '#a9e1ec');
          sky.addColorStop(.62, '#d7f0e9');
          sky.addColorStop(1, '#ffe3ad');
          context.fillStyle = sky;
          context.fillRect(0, 0, width, height);
        }

        for (const cloud of clouds) {
          cloud.x -= cloud.speed * delta;
          if (cloud.x < -cloud.size * 2) {
            cloud.x = width + cloud.size;
            cloud.y = 55 + Math.random() * height * .68;
          }
          drawCloud(cloud, time);
        }
      }

      function drawRing(ring) {
        if (ring.burst) return;
        const rx = ring.radius * .72;
        const ry = ring.radius;
        const isSuccess = ring.successTime > 0;
        context.save();
        context.translate(ring.x, ring.y);
        context.shadowColor = isSuccess ? 'rgba(49, 185, 105, .72)' : 'rgba(121, 79, 22, .28)';
        context.shadowBlur = isSuccess ? 18 : 0;
        context.strokeStyle = isSuccess ? 'rgba(28, 126, 77, .34)' : 'rgba(121, 79, 22, .28)';
        context.lineWidth = 14;
        context.beginPath();
        context.ellipse(3, 4, rx, ry, 0, 0, Math.PI * 2);
        context.stroke();
        const ringColor = context.createLinearGradient(-rx, -ry, rx, ry);
        if (isSuccess) {
          ringColor.addColorStop(0, '#c9ff9f');
          ringColor.addColorStop(.45, '#35c978');
          ringColor.addColorStop(.72, '#e1ffc0');
          ringColor.addColorStop(1, '#198750');
        } else {
          ringColor.addColorStop(0, '#ffe785');
          ringColor.addColorStop(.45, '#edae2b');
          ringColor.addColorStop(.72, '#fff1a1');
          ringColor.addColorStop(1, '#d7901e');
        }
        context.strokeStyle = ringColor;
        context.lineWidth = 11;
        context.beginPath();
        context.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        context.stroke();
        context.strokeStyle = 'rgba(255,255,255,.7)';
        context.lineWidth = 2;
        context.beginPath();
        context.ellipse(-1.5, -1, rx - 4, ry - 4, 0, Math.PI * 1.08, Math.PI * 1.78);
        context.stroke();
        context.restore();
      }

      function drawPlane(time) {
        const x = width * .29;
        const y = planeY + Math.sin(time * .008) * 2;
        const pitch = Math.max(-.32, Math.min(.32, planeVelocity * .00072));
        const bank = Math.max(-.08, Math.min(.08, planeVelocity * .00018));
        const eye = [4.2, -7.2, 4.4];
        const normalize = vector => {
          const length = Math.hypot(...vector);
          return vector.map(value => value / length);
        };
        const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        const forward = normalize(eye.map(value => -value));
        const right = normalize([forward[1], -forward[0], 0]);
        const up = normalize([
          right[1] * forward[2] - right[2] * forward[1],
          right[2] * forward[0] - right[0] * forward[2],
          right[0] * forward[1] - right[1] * forward[0]
        ]);
        const project = point => {
          const cosinePitch = Math.cos(pitch);
          const sinePitch = Math.sin(pitch);
          const pitchedX = point[0] * cosinePitch + point[2] * sinePitch;
          const pitchedZ = -point[0] * sinePitch + point[2] * cosinePitch;
          const cosineBank = Math.cos(bank);
          const sineBank = Math.sin(bank);
          const rotated = [
            pitchedX,
            point[1] * cosineBank - pitchedZ * sineBank,
            point[1] * sineBank + pitchedZ * cosineBank
          ];
          const relative = rotated.map((value, index) => value - eye[index]);
          const depth = dot(relative, forward);
          if (depth <= 0) return null;
          const focalLength = height * .62 / depth;
          return {
            x: dot(relative, right) * focalLength,
            y: -dot(relative, up) * focalLength,
            depth
          };
        };

        const faces = aircraftFaces.slice();
        const propAngle = time * .035;
        for (let blade = 0; blade < 2; blade++) {
          const angle = propAngle + blade * Math.PI;
          const radialY = Math.cos(angle);
          const radialZ = Math.sin(angle);
          const tangentY = -radialZ;
          const tangentZ = radialY;
          const bladePoint = (radius, widthOffset) => [
            1.34,
            radialY * radius + tangentY * widthOffset,
            radialZ * radius + tangentZ * widthOffset
          ];
          faces.push({
            points: [bladePoint(.06, -.07), bladePoint(.46, -.045), bladePoint(.46, .045), bladePoint(.06, .07)],
            color: blade === 0 ? '#465b60' : '#f4d184'
          });
        }

        const projectedFaces = faces.map(face => {
          const points = face.points.map(project);
          if (points.some(point => point === null)) return null;
          return { color: face.color, points, depth: points.reduce((sum, point) => sum + point.depth, 0) / points.length };
        }).filter(Boolean).sort((a, b) => b.depth - a.depth);

        context.save();
        context.fillStyle = 'rgba(42, 88, 88, .14)';
        context.beginPath();
        context.ellipse(x, y + 34, 48, 9, 0, 0, Math.PI * 2);
        context.fill();
        context.lineJoin = 'round';
        context.lineWidth = 1.2;
        for (const face of projectedFaces) {
          context.beginPath();
          context.moveTo(x + face.points[0].x, y + face.points[0].y);
          for (let index = 1; index < face.points.length; index++) {
            context.lineTo(x + face.points[index].x, y + face.points[index].y);
          }
          context.closePath();
          context.fillStyle = face.color;
          context.fill();
          context.strokeStyle = 'rgba(67, 55, 48, .28)';
          context.stroke();
        }
        context.restore();
      }

      function emitSparkles(x, y) {
        const colors = ['#fff3a8', '#f4bd3f', '#fffdf4', '#74df91', '#f58a68'];
        for (let index = 0; index < 30; index++) {
          const angle = index / 30 * Math.PI * 2 + (Math.random() - .5) * .14;
          const speed = 55 + Math.random() * 190;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .65 + Math.random() * .45,
            maxLife: 1.1,
            size: 2 + Math.random() * 4,
            color: colors[index % colors.length]
          });
        }
        floatingScores.push({ x, y: y - 20, life: 1 });
        playChime();
      }

      function drawParticles(delta) {
        particles = particles.filter(particle => particle.life > 0);
        for (const particle of particles) {
          particle.life -= delta;
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.vx *= Math.pow(.42, delta);
          particle.vy += 70 * delta;
          context.globalAlpha = Math.max(0, particle.life / particle.maxLife);
          context.fillStyle = particle.color;
          context.beginPath();
          context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          context.fill();
        }
        context.globalAlpha = 1;

        floatingScores = floatingScores.filter(item => item.life > 0);
        context.save();
        context.direction = 'ltr';
        context.textAlign = 'center';
        context.font = '900 28px "Trebuchet MS", Arial, sans-serif';
        for (const item of floatingScores) {
          item.life -= delta;
          item.y -= 38 * delta;
          context.globalAlpha = Math.min(1, item.life * 2);
          context.lineWidth = 4;
          context.lineJoin = 'round';
          context.strokeStyle = 'rgba(133, 91, 29, .72)';
          context.strokeText('+1', item.x, item.y);
          context.fillStyle = '#fff7c9';
          context.fillText('+1', item.x, item.y);
        }
        context.restore();
        context.globalAlpha = 1;
      }

      function emitSmoke() {
        smoke.push({
          x: width * .29 - 43,
          y: planeY + 2,
          vx: -24 - Math.random() * 20,
          vy: (Math.random() - .5) * 18,
          life: .8 + Math.random() * .45,
          maxLife: 1.25,
          radius: 4 + Math.random() * 4
        });
      }

      function drawSmoke(delta) {
        smoke = smoke.filter(puff => puff.life > 0);
        for (const puff of smoke) {
          puff.life -= delta;
          puff.x += puff.vx * delta;
          puff.y += puff.vy * delta;
          puff.radius += 8 * delta;
          const fade = Math.max(0, puff.life / puff.maxLife);
          context.globalAlpha = fade * .22;
          context.fillStyle = '#f7fbf5';
          context.beginPath();
          context.arc(puff.x, puff.y, puff.radius, 0, Math.PI * 2);
          context.fill();
        }
        context.globalAlpha = 1;
      }

      function ensureAudio() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioContext = new AudioContextClass();
        }
        if (audioContext.state === 'suspended') audioContext.resume();
      }

      function playTone(frequency, duration, volume, type, delay = 0) {
        if (!audioContext) return;
        const startAt = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(.0001, startAt);
        gain.gain.linearRampToValueAtTime(volume, startAt + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + .02);
      }

      function playChime() {
        playTone(660, .2, .075, 'sine');
        playTone(880, .28, .06, 'sine', .08);
        playTone(1320, .34, .035, 'triangle', .16);
      }

      function playCrash() {
        playTone(260, .25, .065, 'triangle');
        playTone(180, .38, .05, 'sine', .12);
      }

      function addRing() {
        const margin = Math.max(82, height * .15);
        const upper = Math.max(margin, height * .2);
        const lower = Math.min(height - margin, height * .78);
        const previous = rings[rings.length - 1];
        let y = upper + Math.random() * Math.max(1, lower - upper);
        if (previous && Math.abs(y - previous.y) > height * .25) {
          y = previous.y + Math.sign(y - previous.y) * height * .2;
        }
        rings.push({ x: width + 70, y, radius: Math.max(40, Math.min(60, height * .105)), passed: false });
      }

      function updateGame(delta) {
        if (status !== 'playing') return;
        smokeTimer += delta;
        while (smokeTimer >= .065) {
          smokeTimer -= .065;
          emitSmoke();
        }
        const acceleration = 980;
        if (keys.up) planeVelocity -= acceleration * delta;
        if (keys.down) planeVelocity += acceleration * delta;
        if (!keys.up && !keys.down) planeVelocity *= Math.pow(.08, delta);
        planeVelocity = Math.max(-330, Math.min(330, planeVelocity));
        planeY += planeVelocity * delta;

        const planeRadius = 18;
        if (planeY < planeRadius + 12 || planeY > height - planeRadius - 12) {
          endGame();
          return;
        }

        const speed = Math.min(320, 190 + score * 6);
        for (const ring of rings) {
          ring.x -= speed * delta;
          if (!ring.passed && ring.x < width * .29 + 8) {
            ring.passed = true;
            if (Math.abs(planeY - ring.y) < ring.radius * .52) {
              score++;
              ring.successTime = .001;
              scoreLabel.textContent = score;
              emitSparkles(width * .29, ring.y);
              if (score > best) {
                best = score;
                bestLabel.textContent = best;
                localStorage.setItem(bestKey, String(best));
              }
            } else {
              endGame();
              return;
            }
          }
          if (ring.successTime > 0) {
            ring.successTime += delta;
            if (ring.successTime > .34) ring.burst = true;
          }
        }
        rings = rings.filter(ring => ring.x > -100);
        if (rings.length === 0 || rings[rings.length - 1].x < width - Math.max(210, width * .32)) addRing();
      }

      function drawGame(delta, time) {
        drawBackground(time, delta);
        if (status === 'ready' && rings.length === 0) {
          rings = [
            { x: width * .69, y: height * .48, radius: Math.max(40, Math.min(60, height * .105)), passed: false },
            { x: width * 1.22, y: height * .36, radius: Math.max(40, Math.min(60, height * .105)), passed: false }
          ];
        }
        if (status === 'playing') {
          updateGame(delta);
          for (const ring of rings) drawRing(ring);
        } else {
          for (const ring of rings) drawRing(ring);
        }
        drawSmoke(delta);
        drawPlane(time);
        drawParticles(delta);
      }

      function startGame() {
        ensureAudio();
        score = 0;
        scoreLabel.textContent = '0';
        planeY = height * .48;
        planeVelocity = 0;
        rings = [];
        particles = [];
        smoke = [];
        floatingScores = [];
        smokeTimer = 0;
        status = 'playing';
        overlay.classList.add('hidden');
        lastTime = performance.now();
        addRing();
      }

      function endGame() {
        status = 'over';
        playCrash();
        keys.up = false;
        keys.down = false;
        controls.forEach(button => button.classList.remove('pressed'));
        title.textContent = score > 0 ? 'איזו טיסה נהדרת!' : 'כמעט הצלחתם!';
        message.textContent = score === 1 ? 'עברת טבעת זהב אחת. יוצאים לסיבוב נוסף?' : `עברתם ${score} טבעות זהב. אפשר לנסות שוב ולשבור את השיא!`;
        startButton.textContent = 'טסים שוב';
        overlay.classList.remove('hidden');
      }

      function frame(time) {
        const delta = Math.min((time - (lastTime || time)) / 1000, .035);
        lastTime = time;
        elapsed = time;
        drawGame(delta, time);
        requestAnimationFrame(frame);
      }

      function setKey(key, isDown) {
        if (key === 'ArrowUp' || key === 'w' || key === 'W') keys.up = isDown;
        if (key === 'ArrowDown' || key === 's' || key === 'S') keys.down = isDown;
      }

      window.addEventListener('keydown', event => {
        if (['ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
        if (event.key === ' ' && status !== 'playing') startGame();
        setKey(event.key, true);
      });
      window.addEventListener('keyup', event => setKey(event.key, false));
      window.addEventListener('blur', () => { keys.up = false; keys.down = false; });
      startButton.addEventListener('click', startGame);
      controls.forEach(button => {
        const direction = button.dataset.direction;
        const release = () => { keys[direction] = false; button.classList.remove('pressed'); };
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          keys[direction] = true;
          button.classList.add('pressed');
          button.setPointerCapture(event.pointerId);
        });
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
